<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCOA - Simulation Results Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f1419;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.2em;
            opacity: 0.95;
            margin-bottom: 20px;
        }

        .header-links {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .paper-link {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
            font-size: 0.95em;
        }

        .paper-link:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        .filters {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #1a202c;
            color: #e2e8f0;
            border: 1px solid #2d3748;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(37, 99, 235, 0.3);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .simulation-card {
            background: #1a202c;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
            border: 1px solid #2d3748;
        }

        .simulation-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(37, 99, 235, 0.2);
            border-color: #2563eb;
        }

        .view-tabs {
            display: flex;
            background: #0f1419;
            border-bottom: 1px solid #2d3748;
            overflow-x: auto;
        }

        .view-tab {
            flex: 1;
            min-width: 100px;
            background: #0f1419;
            border: none;
            padding: 12px 15px;
            cursor: pointer;
            font-size: 0.9em;
            color: #a0aec0;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .view-tab:hover {
            background: #1a202c;
            color: #e2e8f0;
        }

        .view-tab.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
            background: #1a202c;
        }

        .card-media {
            width: 100%;
            height: 250px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .card-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-controls-hint {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8em;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .simulation-card:hover .video-controls-hint {
            opacity: 1;
        }

        .view-description {
            font-size: 0.8em;
            color: #718096;
            padding: 5px 0;
            margin-top: 5px;
            font-style: italic;
        }

        .card-content {
            padding: 25px;
        }

        .card-content h3 {
            font-size: 1.3em;
            margin-bottom: 10px;
            color: #e2e8f0;
        }

        .card-content p {
            color: #cbd5e0;
            margin-bottom: 15px;
            line-height: 1.6;
            font-size: 0.95em;
        }

        .card-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #2d3748;
        }

        .meta-tag {
            background: #2d3748;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            color: #a0aec0;
        }

        .empty-state {
            text-align: center;
            color: white;
            padding: 60px 20px;
        }

        .empty-state h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .loading-state {
            text-align: center;
            color: #cbd5e0;
            padding: 40px 20px;
            font-size: 1.1em;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #2d3748;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            color: #a0aec0;
            padding: 30px;
            opacity: 0.9;
            font-size: 0.9em;
            border-top: 1px solid #2d3748;
        }

        .error-state {
            grid-column: 1/-1;
            text-align: center;
            color: #fc8181;
            padding: 40px 20px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2em;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .filters {
                flex-direction: column;
            }

            .filter-btn {
                width: 100%;
            }

            .header-links {
                flex-direction: column;
            }

            .paper-link {
                width: 100%;
                text-align: center;
            }

            .view-tab {
                flex: 1;
                padding: 10px 8px;
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 RCOA Simulations</h1>
            <p>Relaxed Nonconvex Obstacle Avoidance</p>
            <div class="header-links">
                <a href="https://github.com/rtapia8484/RCOA" class="paper-link">📂 GitHub Repository</a>
                <a href="https://arxiv.org/abs/2512.13836" class="paper-link">📖 Paper 1: Convex Formulation</a>
                <a href="https://arxiv.org/abs/2607.02797" class="paper-link">📖 Paper 2: Extensions</a>
            </div>
        </header>

        <div class="filters" id="filters-container">
            <button class="filter-btn active" onclick="filterGallery('all')">All Scenarios</button>
        </div>

        <div class="gallery" id="gallery">
            <div style="grid-column: 1/-1;">
                <div class="loading-state">
                    <span class="loading-spinner"></span>Loading simulations...
                </div>
            </div>
        </div>

        <footer>
            <p>RCOA Simulation Results Gallery</p>
            <p>By: Ricardo Tapia and Iman Soltani | Systems and Control (eess.SY)</p>
        </footer>
    </div>

    <script>
        let simulations = [];
        let availableScenarios = new Set();
        let currentFilter = 'all';

        /**
         * Transform metadata.json format to card format
         */
        /**
         * Transform metadata.json format to card format (one card per configuration)
         */
        function transformMetadata(metadata, folderTitle) {
            if (!metadata.configurations || metadata.configurations.length === 0) {
                return [];
            }

            // Map each configuration into a separate simulation card object
            return metadata.configurations.map(config => {
                const views = config.views ? config.views.map(view => ({
                    name: view.name,
                    video: encodeURI(view.video),
                    description: view.description
                })) : [];

                if (views.length === 0) return null;

                // Use the configuration's unique name as the filter category
                const scenarioTitle = config.name;
                availableScenarios.add(scenarioTitle);

                return {
                    id: Math.random().toString(36).substr(2, 9),
                    title: metadata.title,
                    description: metadata.description,
                    scenario: scenarioTitle,
                    date: metadata.date,
                    views: views,
                    tags: metadata.category ? metadata.category.split('|') : [],
                    environment: config.parameters?.environment_size || 'Unknown'
                };
            }).filter(Boolean); // Remove any null entries
        }

        /**
         * Load and parse metadata files from manifest
         */
        /**
         * Load and parse metadata files from manifest
         */
        async function loadSimulations() {
            try {
                // Load manifest
                const manifestResponse = await fetch(encodeURI('simulations/manifest.json'));
                if (!manifestResponse.ok) throw new Error('Manifest not found');
                const manifest = await manifestResponse.json();

                // Load each metadata file
                const loadedSimulations = [];
                for (const scenario of manifest.scenarios) {
                    try {
                        const metadataResponse = await fetch(encodeURI(scenario.path));
                        if (metadataResponse.ok) {
                            const metadata = await metadataResponse.json();
                            // Extract scenario name from path (e.g., "Dictating Spatial Homotopy" from "simulations/Dictating Spatial Homotopy/metadata.json")
                            const pathParts = scenario.path.split('/');
                            const folderTitle = pathParts[pathParts.length - 2];
                            const simulationCards = transformMetadata(metadata, folderTitle);
                            if (simulationCards && simulationCards.length > 0) {
                                loadedSimulations.push(...simulationCards);
                            }
                        }
                    } catch (error) {
                        console.warn(`Failed to load ${scenario.path}:`, error);
                    }
                }

                simulations = loadedSimulations;
                updateFilterButtons();
                renderGallery('all');

            } catch (error) {
                console.error('Failed to load simulations:', error);
                displayError('Failed to load simulations. Check the browser console for details.');
            }
        }

        /**
         * Update filter buttons based on available scenarios
         */
        function updateFilterButtons() {
            const filtersContainer = document.getElementById('filters-container');
            const baseButtons = `<button class="filter-btn active" onclick="filterGallery('all')">All Scenarios</button>`;
            
            const scenarioButtons = Array.from(availableScenarios)
                .sort()
                .map(scenario => `<button class="filter-btn" onclick="filterGallery('${scenario}')">${scenario}</button>`)
                .join('');

            filtersContainer.innerHTML = baseButtons + scenarioButtons;
        }

        /**
         * Render gallery with filter
         */
        function renderGallery(filter = 'all') {
            currentFilter = filter;
            const gallery = document.getElementById('gallery');
            const filtered = filter === 'all' 
                ? simulations 
                : simulations.filter(sim => sim.scenario === filter);

            if (filtered.length === 0) {
                gallery.innerHTML = `
                    <div style="grid-column: 1/-1;">
                        <div class="empty-state">
                            <h2>📂 No simulations found</h2>
                            <p>Try a different filter or add simulation metadata files.</p>
                        </div>
                    </div>
                `;
                return;
            }

            gallery.innerHTML = filtered.map(sim => {
                const hasMultipleViews = sim.views && sim.views.length > 1;
                const firstView = sim.views[0];
                
                return `
                    <div class="simulation-card" data-sim-id="${sim.id}">
                        ${hasMultipleViews ? `
                            <div class="view-tabs">
                                ${sim.views.map((view, idx) => `
                                    <button class="view-tab ${idx === 0 ? 'active' : ''}" 
                                            onclick="switchView('${sim.id}', ${idx})"
                                            data-sim-id="${sim.id}">
                                        ${view.name}
                                    </button>
                                `).join('')}
                            </div>
                        ` : ''}
                        <div class="card-media">
                            <video id="video-${sim.id}" controls muted>
                                <source src="${firstView.video}" type="video/mp4">
                                Your browser does not support the video tag.
                            </video>
                            <div class="video-controls-hint">▶ Click to play</div>
                        </div>
                        ${hasMultipleViews ? `
                            <div style="padding: 0 25px 10px;">
                                <div class="view-description" id="view-desc-${sim.id}">
                                    ${firstView.description}
                                </div>
                            </div>
                        ` : ''}
                        <div class="card-content">
                            <h3>${sim.title}</h3>
                            <p>${sim.description}</p>
                            <div class="card-meta">
                                <span class="meta-tag">📍 ${sim.environment}</span>
                                <span class="meta-tag">📅 ${sim.date}</span>
                                ${sim.tags.map(tag => `<span class="meta-tag">${tag}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        /**
         * Switch video view in a card
         */
        function switchView(simId, viewIndex) {
            const simulation = simulations.find(s => s.id === simId);
            if (!simulation || !simulation.views[viewIndex]) return;

            const view = simulation.views[viewIndex];
            const videoElement = document.getElementById(`video-${simId}`);
            const descElement = document.getElementById(`view-desc-${simId}`);

            // Update video source
            videoElement.src = view.video;
            videoElement.load();

            // Update description if exists
            if (descElement) {
                descElement.textContent = view.description;
            }

            // Update active tab styling
            const card = document.querySelector(`[data-sim-id="${simId}"]`);
            const tabs = card.querySelectorAll('.view-tab');
            tabs.forEach((tab, idx) => {
                tab.classList.toggle('active', idx === viewIndex);
            });
        }

        /**
         * Filter gallery by scenario
         */
        function filterGallery(scenario) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderGallery(scenario);
        }

        /**
         * Display error message
         */
        function displayError(message) {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = `
                <div class="error-state">
                    <h2>⚠️ Error</h2>
                    <p>${message}</p>
                </div>
            `;
        }

        // Load simulations on page load
        document.addEventListener('DOMContentLoaded', loadSimulations);
    </script>
</body>
</html>
